[project]
name = "prowler-warden"
version = "0.1.0"
description = "Always-on AWS compliance agent built on Prowler OSS + ClickHouse"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
  "anthropic>=0.40",
  "clickhouse-connect>=0.8",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "rich>=13",
  "typer>=0.12",
]
[project.scripts]
prowler-warden = "warden.cli:app"
warden = "warden.cli:app"  # legacy alias, kept for existing shell habits and permission rules
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/warden"]
